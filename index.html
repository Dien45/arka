<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arka - Coding Agent</title>
    <!--
      Content-Security-Policy notes:
      - script-src/object-src/base-uri are locked down to 'self' (no inline
        scripts, no eval, no third-party script CDNs) — this is the main XSS
        defense-in-depth layer given this app keeps API keys & GitHub tokens
        in localStorage.
      - connect-src is intentionally broad (https/http/ws/wss) because this
        app's core feature is letting the *user* configure arbitrary AI
        provider endpoints (custom/self-hosted providers, local Ollama) and
        fetch arbitrary URLs via the web_fetch tool. A tight allowlist would
        break that functionality. Network-destination safety for AI-initiated
        requests is instead enforced in src/tools.ts (scheme + private-IP
        checks) and via the tool-approval UI in the chat.
      - style-src keeps 'unsafe-inline' for Tailwind/component libraries that
        set the `style` attribute directly; this does not weaken script
        injection protection since script-src has no 'unsafe-inline'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none';"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* Prevent the whole page from ever becoming scrollable — the app
           shell (see App.tsx, h-dvh) is designed so only specific inner
           panels (message list, sidebar, etc.) scroll. If some element ever
           overflows the viewport, this stops it from silently turning into
           "scroll the whole page to find the menu/input" instead of just
           fixing the layout bug. */
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #f0f4f8;
        color: #334155;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        height: 100%;
      }
    </style>
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
